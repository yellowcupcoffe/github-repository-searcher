server:
  port: ${PORT:8080}            # Render/Railway inject PORT; locally we use 8080

spring:
  application:
    name: github-repository-searcher
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:github_searcher}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false         # do not keep a DB connection open while rendering the response
    hibernate:
      ddl-auto: update          # creates/extends tables automatically; see README for the reasoning

github:
  base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
  token: ${GITHUB_TOKEN:}       # optional; empty means unauthenticated requests
  connect-timeout: 5s
  read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health         # only /actuator/health is reachable
  endpoint:
    health:
      show-details: never       # no internal details leak to the public

springdoc:
  swagger-ui:
    operations-sorter: method
